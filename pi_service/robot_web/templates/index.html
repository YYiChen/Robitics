<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Robitics 控制台</title><link rel="stylesheet" href="/static/style.css"><body>
<h1>Robitics 控制台</h1><main><section><img id="video" src="/video_feed" alt="CSI 视频"><p><button id="snapshot">保存当前画面到电脑</button><button id="choose">选择电脑 Pic 文件夹</button><button id="record">开始连续保存</button><button id="stopRecord" disabled>停止保存</button></p><small id="save">图片只写入浏览器已授权的电脑文件夹；需 HTTPS 或 localhost。</small></section>
<section><h2>终端同款控制</h2><p>按住按键或按钮才运动，松开立即停车；树莓派每 200ms 按终端协议发送。网页失焦、断连或空格会停止。</p><div id="pad"><button data-action="FL">Q 前左</button><button data-action="F">W 前进</button><button data-action="FR">E 前右</button><button data-action="PL">A 原地左转</button><button data-action="STOP">STOP</button><button data-action="PR">D 原地右转</button><button data-action="BL">Z 后左</button><button data-action="B">S 后退</button><button data-action="BR">C 后右</button></div><p>当前动作：<strong id="action">STOP</strong>　控制连接：<strong id="client">等待</strong>　<button id="reconnect" type="button">重新连接 Arduino</button></p><h2>前向距离传感器</h2><p><strong id="distance">等待数据…</strong><br><small>中间超声波：TRIG 26 / ECHO 27。仅前进会触发避障。</small></p><h2>后轮速度 PID</h2><label><input id="speedMode" type="checkbox"> 启用速度模式</label><p>直行 PWM <input id="straightPwm" type="number" value="80" min="0" max="255"> 目标 pps <input id="target" type="number" value="30" min="0" max="200"></p><p>Kp <input id="kp" type="number" value="2" step=".1"> Ki <input id="ki" type="number" value=".8" step=".1"> Kd <input id="kd" type="number" value=".05" step=".01"></p><button id="apply">应用 PID 参数</button><h2>状态</h2><pre id="status">读取中…</pre></section></main><script src="/static/app.js"></script></body></html>
