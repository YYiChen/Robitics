<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Robitics 控制台</title><link rel="stylesheet" href="/static/style.css"><body>
<h1>Robitics 控制台</h1><main><section><img id="video" src="/video_feed" alt="CSI 视频"><p><button id="snapshot">保存当前画面到电脑</button><button id="choose">选择电脑 Pic 文件夹</button><button id="record">开始连续保存</button><button id="stopRecord" disabled>停止保存</button></p><small id="save">图片只写入浏览器已授权的电脑文件夹；需 HTTPS 或 localhost。</small></section>
<section><h2>遥控</h2><p>W/A/S/D 或方向键移动；松开即停车，空格紧急停止。</p><button id="stop">紧急停止</button><h2>后轮速度 PID</h2><label><input id="speedMode" type="checkbox"> 启用速度模式</label><p>PWM <input id="pwm" type="number" value="80" min="0" max="255"> 目标 pps <input id="target" type="number" value="30" min="0" max="200"></p><p>Kp <input id="kp" type="number" value="2" step=".1"> Ki <input id="ki" type="number" value=".8" step=".1"> Kd <input id="kd" type="number" value=".05" step=".01"></p><button id="apply">应用 PID 参数</button><h2>状态</h2><pre id="status">读取中…</pre></section></main><script src="/static/app.js"></script></body></html>
